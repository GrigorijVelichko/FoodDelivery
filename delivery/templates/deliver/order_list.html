<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мої замовлення</title>
</head>
<body>
    <h1>Історія замовлень</h1>
    <ul>
        {% for order in orders %}
            <li>
                <strong>Замовлення №{{ order.id }}</strong> — Статус: {{ order.get_status_display }}
                <br>Сума: {{ order.total_price }} грн.
                <br>Дата: {{ order.created_at|date:"d.m.Y H:i" }}
            </li>
            <hr>
        {% empty %}
            <li>У вас поки немає замовлень.</li>
        {% endfor %}
    </ul>
</body>
</html>
